name: pagerduty_demo
version: 0.1.0
dsl_version: 3
backend: file
test_queries:
  - SELECT * FROM pagerduty_demo.incidents LIMIT 1
tables:
  - name: incidents
    description: Deterministic PagerDuty-shaped outage records for the judging replay.
    format: jsonl
    source:
      location: file:///D:/coral_wemakedevs/incident-time-machine/data/pagerduty/
      glob: "**/*.jsonl"
    columns:
      - { name: incident_id, type: Utf8 }
      - { name: title, type: Utf8 }
      - { name: created_at, type: Utf8 }
      - { name: resolved_at, type: Utf8 }
      - { name: severity, type: Utf8 }
      - { name: service, type: Utf8 }
      - { name: alert_url, type: Utf8 }

