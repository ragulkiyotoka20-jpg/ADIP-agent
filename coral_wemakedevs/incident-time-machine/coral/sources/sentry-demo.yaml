name: sentry_demo
version: 0.1.0
dsl_version: 3
backend: file
test_queries:
  - SELECT * FROM sentry_demo.issues LIMIT 1
tables:
  - name: issues
    description: Deterministic Sentry-shaped fatal issues for the judging replay.
    format: jsonl
    source:
      location: file:///D:/coral_wemakedevs/incident-time-machine/data/sentry/
      glob: "**/*.jsonl"
    columns:
      - { name: issue_id, type: Utf8 }
      - { name: service, type: Utf8 }
      - { name: first_seen, type: Utf8 }
      - { name: last_seen, type: Utf8 }
      - { name: level, type: Utf8 }
      - { name: error_message, type: Utf8 }
      - { name: event_count, type: Int64 }
      - { name: issue_url, type: Utf8 }

