name: crawler_demo
version: 0.1.0
dsl_version: 3
backend: file
test_queries:
  - SELECT * FROM crawler_demo.evidence LIMIT 1
tables:
  - name: evidence
    description: Browser crawler evidence captured immediately before and after customer impact.
    format: jsonl
    source:
      location: file:///D:/coral_wemakedevs/incident-time-machine/data/crawler/
      glob: "**/*.jsonl"
    columns:
      - { name: capture_id, type: Utf8 }
      - { name: service, type: Utf8 }
      - { name: captured_at, type: Utf8 }
      - { name: phase, type: Utf8 }
      - { name: route, type: Utf8 }
      - { name: status, type: Utf8 }
      - { name: screenshot_url, type: Utf8 }
      - { name: diff_score, type: Float64 }

